name: build-apk-nocomments
on:
  push:
  workflow_dispatch:
env:
  Z: ""
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e2346c8a02591b2d1933f88d08e8abff5b816f6
          fetch-depth: 1
      - name: strip
        run: echo "$Z" | base64 -d | gunzip > /tmp/s.py && python3 /tmp/s.py && git status --short
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: build
        run: ./android/gradlew -p android :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: bilight-nocomments
          path: android/app/build/outputs/apk/debug/app-debug.apk
